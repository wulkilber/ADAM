const summary=()=>{const a=student($('#student-select').value);$('#student-summary').innerHTML=a?`<div class="note">${esc(a.curso)} · ${esc(a.turma)}<br><strong>${annual(a.id).length} de 3 ocorrências em ${year}</strong>${annual(a.id).length===2?'<p>Este registro atingirá o limite de três ocorrências e incluirá o aluno na lista de encaminhamentos ao DEP.</p>':annual(a.id).length>=3?'<p>Limite atingido. Novos registros dependem de definição institucional.</p>':''}</div>`:''};summary();$('#student-select').onchange=()=>{dirty=true;summary()};$('#student-search').oninput=e=>{const q=e.target.value.toLowerCase(),prev=$('#student-select').value;$('#student-select').innerHTML='<option value="">Selecione um aluno</option>'+db.Alunos.filter(a=>a.ativo&&(a.nome+' '+a.matricula).toLowerCase().includes(q)).map(a=>`<option value="${a.id}" ${a.id===prev?'selected':''}>${esc(a.nome)} · ${esc(a.matricula)}</option>`).join('');summary()};$('#occurrence-form').oninput=()=>dirty=true;$('#occurrence-form').onsubmit=e=>{e.preventDefault();const p={alunoId:$('#student-select').value,anoLetivo:year,irregularidades:[...document.querySelectorAll('[name=types]:checked')].map(x=>x.value),observacao:$('#observation').value,chaveIdempotencia:pendingKey||uid()};try{IFAM.normalize('registrarOcorrencia',p);if(annual(p.alunoId).length>=3)throw new Error('Limite atingido. A política após três ocorrências está pendente de definição.')}catch(err){$('#form-error').innerHTML=`<div class="error">${esc(err.message)}</div>`;return}pendingKey=p.chaveIdempotencia;modal(`<h2>Conferir e confirmar</h2><p><strong>${esc(student(p.alunoId).nome)}</strong> · ${year}</p><p>${p.irregularidades.map(typeDescription).join(' e ')}</p><p>${esc(p.observacao||'Sem observação.')}</p><div class="note">Este registro conta como uma abordagem.${annual(p.alunoId).length===2?' Será criada uma pendência de encaminhamento ao DEP.':''}</div><div id="confirm-error" role="alert"></div><div class="actions"><button data-close>Voltar</button><button class="primary" id="confirm-register">Confirmar registro</button></div>`);$('#confirm-register').onclick=async()=>{const b=$('#confirm-register');b.disabled=true;b.textContent='Registrando…';try{const result=await service.mutate('registrarOcorrencia',p);await service.refresh();dirty=false;pendingKey=null;$('#modal').close();$('#content').innerHTML=heading('REGISTRO CONCLUÍDO','Abordagem registrada.','O histórico do aluno foi atualizado.')+`<div class="panel form-card"><div class="panel-body"><div class="success">✓ ${esc(student(p.alunoId).nome)} · ${result.contagem} de 3 ocorrências em ${year}.</div>${result.encaminhamento?'<p>Uma pendência foi criada no DEP. O documento ainda não foi encaminhado.</p>':''}<div class="actions"><button onclick="navigate('profile','${p.alunoId}')">Ver histórico</button>${result.encaminhamento?`<button onclick="navigate('dep','${result.encaminhamento.id}')">Ver encaminhamento ao DEP</button>`:''}<button class="primary" onclick="navigate('register')">Registrar outra ocorrência</button></div></div></div>`}catch(err){$('#confirm-error').innerHTML=`<div class="error">${esc(err.message)}</div>`;b.disabled=false;b.textContent='Tentar novamente'}}}}
function dep(only=false){if(selected){referralDetail();return}const rs=db.Encaminhamentos.filter(e=>+e.anoLetivo===year&&(!statusFilter||e.status===statusFilter)&&matches(student(e.alunoId)));const list=rs.length?`<table class="responsive-table"><thead><tr><th>Aluno</th><th>Turma</th><th>Limite atingido</th><th>Status</th><th></th></tr></thead><tbody>${rs.map(e=>`<tr><td>${person(student(e.alunoId))}</td><td data-label="Turma">${esc(student(e.alunoId).turma)}</td><td data-label="Data">${dt(e.criadoEm)}</td><td>${badge(e.status)}</td><td><button class="text-link" onclick="navigate('dep','${e.id}')">Ver detalhes ${icon('arrow')}</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">Nenhum encaminhamento encontrado com estes filtros.</div>';if(only){$('#ref-results').innerHTML=list;return}$('#content').innerHTML=heading('ACOMPANHAMENTO','Encaminhamentos ao DEP',`Pendências e atendimentos dos alunos com três ocorrências em ${year}.`)+`<div class="tabs">${['PENDENTE','ENCAMINHADO','CONCLUIDO',''].map(s=>`<button class="${statusFilter===s?'active':''}" data-status="${s}">${labels[s]||'Todos'} <span class="badge">${db.Encaminhamentos.filter(e=>+e.anoLetivo===year&&(!s||e.status===s)).length}</span></button>`).join('')}</div>`+filters()+`<section class="panel" id="ref-results">${list}</section><div class="note">Emitir um documento não altera o status. Registre o encaminhamento após realizar o envio ao DEP.</div>`;filterEvents(dep);document.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>{statusFilter=b.dataset.status;dep()})}
function referralDetail(){const r=db.Encaminhamentos.find(e=>e.id===selected);if(!r){selected='';dep();return}const snap=JSON.parse(r.snapshotJson);$('#content').innerHTML=heading('ENCAMINHAMENTO AO DEP',esc(snap.aluno.nome),`${esc(snap.aluno.matricula)} · ${esc(snap.aluno.turma)} · Ano letivo ${r.anoLetivo}`,`<button onclick="navigate('dep')">Voltar para encaminhamentos</button>`)+`<div class="grid"><section class="panel"><div class="panel-head"><h2>Três abordagens vinculadas</h2>${badge(r.status)}</div><div class="panel-body">${historyHTML(snap.ocorrencias)}</div></section><div><section class="panel"><div class="panel-body"><h2>Documento e acompanhamento</h2><p>O documento preserva os dados do momento em que o limite foi atingido.</p><div class="actions" style="justify-content:stretch;flex-direction:column"><button onclick="navigate('document','${r.id}')">${icon('dep')} Visualizar documento</button>${live?`<button id="pdf-download">Baixar PDF</button>`:''}${r.status==='PENDENTE'&&can('send')?'<button class="primary" id="transition">Registrar encaminhamento</button>':r.status==='ENCAMINHADO'&&can('complete')?'<button class="primary" id="transition">Concluir atendimento</button>':''}</div>${r.encaminhadoEm?`<p>Encaminhado em ${dt(r.encaminhadoEm)}<br>${esc(r.observacaoEncaminhamento)}</p>`:''}${r.concluidoEm?`<p>Concluído em ${dt(r.concluidoEm)}<br>${esc(r.observacaoConclusao)}</p>`:''}</div></section><div class="note">A conclusão mantém as três ocorrências no histórico do ano letivo.</div></div></div>`;if($('#transition'))$('#transition').onclick=()=>transition(r);if($('#pdf-download'))$('#pdf-download').onclick=()=>pdf(r.id)}
function transition(r){const send=r.status==='PENDENTE',key=uid();modal(`<h2>${send?'Registrar encaminhamento':'Concluir atendimento'}</h2><p>${send?'Confirme que o encaminhamento foi realizado.':'Confirme a conclusão do atendimento no DEP.'} A data e o responsável serão registrados agora.</p><form><label class="field">Observação <textarea name="observacao" maxlength="2000"></textarea></label><div id="modal-error" role="alert"></div><div class="actions"><button type="button" data-close>Cancelar</button><button class="primary">Confirmar ${send?'encaminhamento':'conclusão'}</button></div></form>`,async e=>{e.preventDefault();const b=e.target.querySelector('.primary');b.disabled=true;try{await service.mutate(send?'registrarEncaminhamento':'concluirEncaminhamento',{id:r.id,observacao:new FormData(e.target).get('observacao'),versaoEsperada:r.versao,chaveIdempotencia:key});await service.refresh();$('#modal').close();render();toast('Status atualizado. O histórico foi preservado.')}catch(err){$('#modal-error').innerHTML=`<div class="error">${esc(err.message)}</div>`}finally{b.disabled=false}})}
function docHTML(r,snap){return `<div class="document"><div class="eyebrow">INSTITUTO FEDERAL DO AMAZONAS</div><h2>IFAM · ${esc(config.campus)}</h2><hr><h1>Encaminhamento ao DEP</h1><p>Identificador: ${esc(r.id)}<br>Ano letivo: ${r.anoLetivo}</p><h3>Identificação do estudante</h3><p><strong>${esc(snap.aluno.nome)}</strong><br>Matrícula: ${esc(snap.aluno.matricula)}<br>Curso: ${esc(snap.aluno.curso)} · Turma: ${esc(snap.aluno.turma)}</p><p>O estudante atingiu três ocorrências no ano letivo indicado. Seguem os registros que motivaram este encaminhamento para acompanhamento pelo DEP.</p>${snap.ocorrencias.map((o,i)=>`<article><h3>${i+1}. Abordagem de ${dt(o.dataHoraAbordagem)}</h3><p>${JSON.parse(o.irregularidadesJson).map(typeDescription).join('; ')}.</p><p>Observação: ${esc(o.observacao||'Sem observação.')}<br>Assistente: ${esc(o.assistenteNome)}</p></article>`).join('')}<p>Emitido em ${dt(new Date().toISOString())} por ${esc(user.nome)}.</p><div class="signature">________________________________________<br>Assinatura do responsável</div>${!live?'<p class="no-print">Documento demonstrativo · dados fictícios.</p>':''}</div>`}
async function documentView(){const r=db.Encaminhamentos.find(e=>e.id===selected);if(!r)return;$('#content').innerHTML='<p>Preparando documento…</p>';try{const data=live?await rpc('obterDadosDocumento',{encaminhamentoId:r.id}):{snapshot:JSON.parse(r.snapshotJson)};$('#content').innerHTML=heading('DOCUMENTO','Encaminhamento ao DEP','A emissão não altera o status do encaminhamento.',`<button onclick="navigate('dep','${r.id}')">Voltar</button>`)+`<div class="actions no-print" style="margin-bottom:20px">${live?'<button id="pdf-download">Baixar PDF</button>':''}<button class="primary" id="print">Imprimir / Salvar como PDF</button></div>`+docHTML(r,data.snapshot);$('#print').onclick=()=>window.print();if($('#pdf-download'))$('#pdf-download').onclick=()=>pdf(r.id)}catch(e){$('#content').innerHTML=`<div class="error">${esc(e.message)}</div>`}}
async function pdf(id){const b=$('#pdf-download');b.disabled=true;try{const d=await rpc('gerarPdfEncaminhamento',{encaminhamentoId:id,chaveIdempotencia:uid()});const bytes=Uint8Array.from(atob(d.base64),c=>c.charCodeAt(0)),url=URL.createObjectURL(new Blob([bytes],{type:d.mime}));const a=document.createElement('a');a.href=url;a.download=d.nome;a.click();setTimeout(()=>URL.revokeObjectURL(url),10000)}catch(e){toast(e.message)}finally{b.disabled=false}}
function dateEvents(fn){$('#from').onchange=e=>{from=e.target.value;fn()};$('#to').onchange=e=>{to=e.target.value;fn()}}
function reports(){const os=filteredOccurrences(),ids=new Set(os.map(o=>o.alunoId)),refs=db.Encaminhamentos.filter(e=>+e.anoLetivo===year&&(!course||student(e.alunoId).curso===course)&&(!classroom||student(e.alunoId).turma===classroom)&&(!from||e.criadoEm.slice(0,10)>=from)&&(!to||e.criadoEm.slice(0,10)<=to));$('#content').innerHTML=heading('ANÁLISE DO ANO LETIVO','Relatórios',`Indicadores de ${year} calculados a partir dos registros válidos.`)+`<div class="filterbar"><label class="field" style="margin:0">De<input type="date" id="from" value="${from}"></label><label class="field" style="margin:0">Até<input type="date" id="to" value="${to}"></label><select id="course" aria-label="Curso">${options('curso',course)}</select><select id="classroom" aria-label="Turma">${options('turma',classroom)}</select><select id="type" aria-label="Tipo de ocorrência"><option value="">Todos os tipos de ocorrência</option>${IFAM.TYPES.map(t=>`<option value="${t}" ${typeFilter===t?'selected':''}>${labels[t]}</option>`).join('')}</select></div>`+stats([[os.length,'Abordagens','No período e filtros selecionados','dep'],[ids.size,'Alunos envolvidos','Contagem de alunos distintos','students'],[refs.length,'Encaminhamentos','Por data de criação e turma/curso','arrow'],[refs.filter(e=>e.status==='CONCLUIDO').length,'Atendimentos concluídos','Entre os encaminhamentos filtrados','check']])+`<div class="grid"><section class="panel"><div class="panel-head"><h2>Irregularidades registradas</h2></div><div class="panel-body">${IFAM.TYPES.map(t=>{const n=os.filter(o=>JSON.parse(o.irregularidadesJson).includes(t)).length;return `<div style="display:flex;justify-content:space-between;font-size:13px"><span>${t==='ATRASO'?'Atrasos':labels[t]+' fora do padrão'}</span><strong>${n}</strong></div><div class="bar"><span style="width:${os.length?n/os.length*100:0}%"></span></div>`}).join('')}<p>Uma ocorrência pode conter mais de uma irregularidade. A soma por tipo pode superar o total de abordagens.</p></div></section><section class="panel"><div class="panel-head"><h2>Situação dos encaminhamentos</h2></div><div class="panel-body">${['PENDENTE','ENCAMINHADO','CONCLUIDO'].map(s=>`<p style="display:flex;justify-content:space-between;margin:15px 0">${badge(s)}<strong>${refs.filter(e=>e.status===s).length}</strong></p>`).join('')}<p>O filtro de irregularidade aplica-se às abordagens. Encaminhamentos consideram ano, período, curso e turma.</p></div></section></div><section class="panel"><div class="panel-head"><h2>Registros do período</h2><span class="badge">${os.length} registros</span></div>${occurrenceTable(os)}</section>`;dateEvents(reports);$('#course').onchange=e=>{course=e.target.value;reports()};$('#classroom').onchange=e=>{classroom=e.target.value;reports()};$('#type').onchange=e=>{typeFilter=e.target.value;reports()}}
function settings(){$('#content').innerHTML=heading('INFORMAÇÕES','Sobre o sistema','Configuração institucional e situação deste ambiente.')+`<section class="panel"><div class="panel-body"><h2>${live?'Google Apps Script · ambiente integrado':'Demonstração interativa'}</h2><p>${live?'Identidade e permissões verificadas pelo servidor.':'Dados fictícios são mantidos neste navegador. Este ambiente não grava em Google Sheets e não autentica uma conta Google.'}</p><h3>Configurações pendentes de validação</h3><p>Campus: ${esc(config.campus)}<br>Marca oficial: arquivo a fornecer; identificação textual provisória.<br>Perfis e permissões: proposta técnica a confirmar.<br>Após três ocorrências: política pendente de definição; novos registros bloqueados no MVP.</p><h3>Armazenamento institucional</h3><p>O código de instalação usa Google Sheets e Apps Script. A interface institucional deve ser publicada no HTML Service do mesmo projeto para autenticar e chamar os serviços.</p>${!live?'<button id="reset-demo">Restaurar dados fictícios</button>':''}</div></section>`;if($('#reset-demo'))$('#reset-demo').onclick=()=>{if(confirm('Restaurar a demonstração? Os registros fictícios adicionados neste navegador serão removidos.')){db=seed();localStorage.setItem('ifam-demo-v1',JSON.stringify(db));toast('Demonstração restaurada.');render()}}}
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});login();
</script></body></html>
